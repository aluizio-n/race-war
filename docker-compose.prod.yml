services:
  # ─── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: racewar-postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - racewar-net
    # No exposed port — postgres is internal only in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile        # multi-stage production build
    container_name: racewar-api
    restart: always
    environment:
      NODE_ENV:                      production
      DATABASE_URL:                  postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET:                    ${JWT_SECRET}
      JWT_EXPIRES_IN:                ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-30}
      BCRYPT_ROUNDS:                 ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN:                   ${CORS_ORIGIN}
      VAPID_EMAIL:                   ${VAPID_EMAIL}
      VAPID_PUBLIC_KEY:              ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY:             ${VAPID_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - racewar-net
    # No exposed port — traffic comes through nginx only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # ─── Nginx reverse proxy ───────────────────────────────────────────────────
  # Handles HTTP→HTTPS redirect, WebSocket upgrade, and X-Forwarded-* headers.
  # For SSL: mount fullchain.pem + privkey.pem into ./nginx/certs/ and
  # uncomment the HTTPS server block in nginx/nginx.prod.conf.
  nginx:
    image: nginx:1.27-alpine
    container_name: racewar-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # place SSL certs here
    depends_on:
      api:
        condition: service_healthy
    networks:
      - racewar-net
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  racewar-net:
    driver: bridge

volumes:
  postgres_data:
