services:
  postgres:
    image: postgres:16-alpine
    container_name: racewar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: racewar
      POSTGRES_PASSWORD: racewar123
      POSTGRES_DB: racewar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racewar -d racewar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: racewar-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://racewar:racewar123@postgres:5432/racewar?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres_data:
