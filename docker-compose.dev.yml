services:
  # ─── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: racewar-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-racewar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-racewar}
      POSTGRES_DB:       ${POSTGRES_DB:-racewar}
    ports:
      - "5432:5432"           # exposed for local DB clients (TablePlus, DBeaver, etc.)
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - racewar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-racewar} -d ${POSTGRES_DB:-racewar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API (hot reload) ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: racewar-api-dev
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      NODE_ENV:                    development
      DATABASE_URL:                postgresql://${POSTGRES_USER:-racewar}:${POSTGRES_PASSWORD:-racewar}@postgres:5432/${POSTGRES_DB:-racewar}?schema=public
      JWT_SECRET:                  ${JWT_SECRET}
      JWT_EXPIRES_IN:              ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-30}
      BCRYPT_ROUNDS:               ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN:                 ${CORS_ORIGIN:-*}
      VAPID_EMAIL:                 ${VAPID_EMAIL:-}
      VAPID_PUBLIC_KEY:            ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:           ${VAPID_PRIVATE_KEY:-}
    volumes:
      - ./backend/src:/app/src           # hot reload
      - ./backend/prisma:/app/prisma     # schema changes
      - api_node_modules:/app/node_modules  # keep container node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - racewar-net

  # ─── Expo Metro bundler ────────────────────────────────────────────────────
  # Devices connect to the Metro server via HOST_IP (your machine's LAN IP).
  # Find it with:  ipconfig (Windows) | ifconfig en0 (macOS) | hostname -I (Linux)
  expo:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: racewar-expo-dev
    restart: unless-stopped
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go protocol
      - "19001:19001" # Expo DevTools WebSocket
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS:      "0.0.0.0"
      REACT_NATIVE_PACKAGER_HOSTNAME:    ${HOST_IP:-localhost}
      EXPO_PUBLIC_API_URL:               http://${HOST_IP:-localhost}:3333
      EXPO_PUBLIC_WS_URL:                http://${HOST_IP:-localhost}:3333
    volumes:
      - ./frontend:/app
      - expo_node_modules:/app/node_modules  # keep container node_modules
    depends_on:
      - api
    networks:
      - racewar-net

networks:
  racewar-net:
    driver: bridge

volumes:
  postgres_dev_data:
  api_node_modules:
  expo_node_modules:
